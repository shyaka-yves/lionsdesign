name: Deploy to cPanel on push

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cPanel
        uses: pinkasey/cpanel-deploy-action@v1.2.1
        with:
          hostname: ${{ secrets.CPANEL_HOST }}
          cpanel_username: ${{ secrets.CPANEL_USERNAME }}
          cpanel_token: ${{ secrets.CPANEL_TOKEN }}
          cPanelApiPort: 2083
          repository_root: "/home/lionsdes/repositories/lionsdesign"
          updateRepository: true
          branch: main
