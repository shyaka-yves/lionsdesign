---
deployment:
  tasks:
    # 1) Set where your live site is published
    - export DEPLOYPATH=/home/lionsdes/public_html

    # 2) Clean public_html but keep maintenance index.php until deploy completes
    - /usr/bin/find "$DEPLOYPATH" -mindepth 1 -maxdepth 1 ! -name "index.php" -exec rm -rf {} +

    # 3) Sync repo files into public_html (overwriting maintenance index.php at the end)
    - /usr/bin/rsync -a --delete \
        --exclude=".git" \
        --exclude=".github" \
        --exclude="node_modules" \
        ./ "$DEPLOYPATH"/
